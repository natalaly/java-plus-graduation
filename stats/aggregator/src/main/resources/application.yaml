spring:
  application:
    name: aggregator

  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: config-server
      fail-fast: true
      retry:
        useRandomPolicy: true
        max-interval: 15000
        max-attempts: 7
        initial-interval: 3000
        multiplier: 1.5

eureka:
  client:
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/
    registerWithEureka: true
  instance:
    prefer-ip-address: true



