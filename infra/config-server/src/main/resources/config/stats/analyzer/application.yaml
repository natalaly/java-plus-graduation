spring:
  application:
    name: analyzer

  kafka:
    bootstrap-servers: localhost:9092
    topics:
      user-action: stats.user-actions.v1
      event-similarity: stats.events-similarity.v1
    group-id:
      user-action: analyzer.user-actions
      event-similarity: analyzer.event-similarity

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  sql:
    init:
      mode: always

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ewm_stats_db
    username: postgres
    password: password


grpc:
  server:
    port: 0

server:
  port: 0

logging:
  level:
    ru.practicum: TRACE
    org.springframework.kafka: DEBUG
    io.grpc: DEBUG


